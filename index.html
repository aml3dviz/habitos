<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#063e34"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>Hábitos 1.1</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" sizes="180x180" href="icon-180.png"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1b293a;background:#f4f6f9}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:760px;margin:auto;min-height:100vh;padding:24px 18px 100px}.top{display:flex;justify-content:space-between;align-items:center}.eyebrow{font-size:12px;color:#718094;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}h1{font-size:30px;margin:4px 0 18px}h2{font-size:18px;margin:0 0 14px}.muted{color:#718094;font-size:13px}.panel{background:white;border:1px solid #e5eaf0;border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 5px 20px #1d314608}.progress{height:9px;background:#e9eef2;border-radius:9px;overflow:hidden;margin:12px 0}.fill{height:100%;background:#3c987d;border-radius:9px;transition:width .2s}.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.pill{border-radius:99px;padding:7px 11px;background:#edf4f2;color:#26745f;font-size:12px;font-weight:700}.tabs{display:flex;gap:6px;background:#e8edf2;padding:5px;border-radius:14px;overflow:auto}.tabs button{border:0;background:transparent;padding:10px 13px;border-radius:10px;color:#59697c;font-size:13px;white-space:nowrap;flex:1}.tabs button.active{background:white;color:#1b293a;box-shadow:0 2px 8px #0001;font-weight:700}.item{padding:13px 0;border-bottom:1px solid #edf0f3}.item:last-child{border:0}.item-title{font-weight:650;font-size:14px}.time{font-size:12px;color:#778698;width:45px;flex-shrink:0}.check{width:24px;height:24px;accent-color:#318c71;cursor:pointer}.smallbtn{background:#f0f3f7;border:0;border-radius:10px;padding:8px 11px;color:#33445b}.primary{background:#172c43;color:white;border:0;border-radius:12px;padding:12px 16px;font-weight:650}.secondary{background:white;border:1px solid #dce3eb;border-radius:12px;padding:11px 14px}.danger{color:#c34444}.section-title{margin:22px 2px 8px;font-size:13px;color:#6b7b8d;text-transform:uppercase;letter-spacing:1px;font-weight:750}.bar{height:6px;background:#e9eef2;border-radius:10px;overflow:hidden;margin-top:9px}.bar>div{height:100%;background:#3c987d}.counter{display:flex;gap:7px;align-items:center;margin-top:8px}.counter button{border:0;background:#e9f1ee;color:#26745f;border-radius:9px;padding:7px 12px;font-weight:800}.score{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.score button{border:1px solid #dbe2e9;background:#fff;border-radius:9px;padding:7px 10px;font-size:12px}.score button.selected{background:#dff1e9;border-color:#3c987d;color:#226e55}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5eaf0;display:flex;justify-content:center;padding:9px 8px calc(9px + env(safe-area-inset-bottom));z-index:4}.nav-inner{display:flex;max-width:760px;width:100%;justify-content:space-around}.nav button{border:0;background:transparent;color:#738195;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 7px}.nav button.active{color:#247e66;font-weight:750}.nav .ico{font-size:21px}.field{display:flex;flex-direction:column;gap:6px;margin:11px 0}.field label{font-size:12px;font-weight:700;color:#526176}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #dbe2ea;border-radius:10px;background:white;color:#172c43}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.days{display:flex;gap:5px;flex-wrap:wrap}.days label{font-size:12px;background:#eef2f5;border-radius:8px;padding:8px}.days input{accent-color:#328e73}.datebar{display:flex;align-items:center;gap:10px}.datebar input{padding:9px;border-radius:10px;border:1px solid #dce3eb;flex:1;min-width:0}.empty{text-align:center;padding:25px;color:#718094;font-size:14px}.metric{font-size:26px;font-weight:800}.notice{font-size:12px;color:#7a8797;line-height:1.5}.hidden{display:none!important}@media(min-width:720px){.shell{padding-top:36px}.nav{bottom:12px;left:50%;right:auto;transform:translateX(-50%);border:1px solid #e5eaf0;border-radius:20px;padding:10px;width:650px;box-shadow:0 8px 24px #0001}}
 .agenda-card{border-left:5px solid var(--accent);background:var(--tint);border-radius:13px;padding:12px;margin:4px 0;display:flex;gap:10px;align-items:center}.agenda-card .symbol{font-size:22px;width:32px;text-align:center}.agenda-card .details{flex:1;min-width:0}.agenda-card button{font-size:12px}.agenda-track{border-left:2px solid #e5eaf0;margin-left:39px;padding-left:13px}.agenda-time{font-size:12px;color:#617187;min-width:52px}.agenda-line{display:flex;gap:9px;align-items:stretch;margin:9px 0}.agenda-line .agenda-card{flex:1}.agenda-line .agenda-card.conflict{outline:2px solid #d65c53}.hint{font-size:12px;color:#718094;line-height:1.5}.editbox{background:#f3f6fa;border-radius:14px;padding:14px;margin-top:12px}.warn{color:#b34735;font-size:13px;font-weight:650}.category-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px} </style></head><body><div class="shell"><div class="top"><div><div class="eyebrow">Organización personal</div><h1 id="heading">Mi día</h1></div><button class="smallbtn" onclick="exportData()" title="Exportar copia de seguridad">↧ Copia</button></div><main id="app"></main></div><nav class="nav"><div class="nav-inner" id="nav"></div></nav><script>
const KEY='habitos-v1-local';const weekday=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];const isoLocal=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const today=isoLocal();const seed=[{id:'estudio',name:'Estudio / IA',kind:'check',category:'Estudio',time:'08:00',days:[1,3],repeat:true},{id:'trabajo',name:'Trabajo AML Renders',kind:'check',category:'Trabajo',time:'09:00',days:[1,2,3,4,5],repeat:true},{id:'tobillo',name:'Rutina de tobillo',kind:'check',category:'Salud',time:'',days:[1,3,5],repeat:true},{id:'gym',name:'Gimnasio',kind:'check',category:'Entrenamiento',time:'12:00',days:[1,2,3,4,5],repeat:true},{id:'trabajo2',name:'Trabajo de tarde',kind:'check',category:'Trabajo',time:'15:00',days:[1,2,3,4,5],repeat:true},{id:'cardio',name:'Cardio / caminata',kind:'check',category:'Salud',time:'18:30',days:[2,4,6],repeat:true},{id:'lectura',name:'Lectura',kind:'check',category:'Personal',time:'21:30',days:[0,1,2,3,4,5,6],repeat:true},{id:'comer',name:'Comer bien',kind:'rating',category:'Alimentación',time:'',days:[0,1,2,3,4,5,6],repeat:true},{id:'creatina',name:'Tomar creatina',kind:'check',category:'Suplementación',time:'',days:[0,1,2,3,4,5,6],repeat:true},{id:'proteina',name:'Proteína consumida',kind:'quantity',category:'Alimentación',time:'',days:[0,1,2,3,4,5,6],repeat:true,target:120,step:10,unit:'g'},{id:'agua',name:'Agua',kind:'quantity',category:'Salud',time:'',days:[0,1,2,3,4,5,6],repeat:true,target:2500,step:250,unit:'ml'}];
let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}if(!state||!Array.isArray(state.items)||!state.logs)state={items:seed,logs:{}};let view='Hoy',date=today,editing=null,dayEditing=null,dayError='';state.overrides=state.overrides||{};const categories={'Trabajo':['#3F83D9','#E9F2FF','💻'],'Estudio':['#8C63C7','#F2EBFF','📖'],'Entrenamiento':['#E58A36','#FFF0DF','🏋️'],'Salud':['#E58A36','#FFF0DF','🏋️'],'Personal':['#728094','#EDF0F4','✓'],'Alimentación':['#36A27A','#E4F6ED','🥗'],'Suplementación':['#D5A12E','#FFF6D9','💊']};const catStyle=i=>categories[i.category]||categories.Personal;const minTime=t=>{if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(t||''))return NaN;let [h,m]=t.split(':').map(Number);return h*60+m};const clock=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');const duration=i=>Number(i.duration)||({trabajo:180,trabajo2:180,gym:90,estudio:60,lectura:30,cardio:45}[i.id]||60);const dayItem=(i,d)=>({...i,...(state.overrides[d+'|'+i.id]||{})});const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dayNum=s=>new Date(s+'T12:00:00').getDay();const scheduled=(i,d)=>i.repeat?i.days.includes(dayNum(d)):i.date===d;const due=d=>state.items.filter(i=>scheduled(i,d)).map(i=>dayItem(i,d));const logKey=(id,d)=>d+'|'+id;const value=(i,d)=>state.logs[logKey(i.id,d)]??(i.kind==='quantity'?0:i.kind==='rating'?'':false);const complete=(i,d)=>i.kind==='check'?value(i,d)===true:i.kind==='quantity'?Number(value(i,d))>=Number(i.target):value(i,d)==='yes';const pct=(arr,d)=>arr.length?Math.round(100*arr.filter(i=>complete(i,d)).length/arr.length):0;const setLog=(id,v)=>{state.logs[logKey(id,date)]=v;save();render()};const navs=[['Hoy','◉'],['Calendario','▦'],['Hábitos','✓'],['Tareas','☷'],['Estadísticas','▥']];function go(v){view=v;editing=null;render()};function render(){document.getElementById('heading').textContent=({Hoy:'Mi día',Calendario:'Calendario',Hábitos:'Mis hábitos',Tareas:'Mis tareas',Estadísticas:'Estadísticas'})[view];document.getElementById('nav').innerHTML=navs.map(([n,icon])=>`<button class="${view===n?'active':''}" onclick="go('${n}')"><span class="ico">${icon}</span>${n}</button>`).join('');document.getElementById('app').innerHTML=view==='Hoy'?renderToday():view==='Calendario'?renderCalendar():view==='Hábitos'?renderList(true):view==='Tareas'?renderList(false):renderStats()}
function dateSelector(){return `<div class="datebar"><button class="smallbtn" onclick="shiftDate(-1)">‹</button><input type="date" value="${date}" onchange="date=this.value;render()"><button class="smallbtn" onclick="shiftDate(1)">›</button><button class="smallbtn" onclick="date='${today}';render()">Hoy</button></div>`}function shiftDate(n){let d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);date=isoLocal(d);render()}
function renderToday(){let all=due(date),timed=all.filter(i=>i.time).sort((a,b)=>iTime(a)-iTime(b)),untimed=all.filter(i=>!i.time&&i.repeat),tasks=all.filter(i=>!i.repeat&&!i.time);return `${dateSelector()}<section class="panel"><div class="row between"><div><div class="muted">Progreso del día</div><div class="metric">${pct(all,date)}%</div></div><span class="pill">${all.filter(i=>complete(i,date)).length} de ${all.length}</span></div><div class="progress"><div class="fill" style="width:${pct(all,date)}%"></div></div></section><div class="section-title">Agenda flexible · ${esc(date)}</div><section class="panel"><p class="hint">Tocá «Mover» para cambiar el horario o la duración solo de este día. Tu rutina semanal permanece intacta.</p>${renderAgenda(timed)}<div id="day-editor"></div></section>${section('Hábitos sin horario',untimed)}${section('Tareas del día',tasks)}<button class="primary" onclick="go('Tareas');openEditor(false)">+ Nueva tarea</button>`}
function iTime(i){return minTime(i.time)}
function renderAgenda(items){if(!items.length)return '<div class="empty">Sin actividades con horario.</div>';let prev=0;return items.map(i=>{let start=iTime(i),end=start+duration(i),conflict=items.some(x=>x.id!==i.id&&start<iTime(x)+duration(x)&&iTime(x)<end);let [color,tint,symbol]=catStyle(i);let gap=start>prev?`<div class="hint" style="margin:9px 0 9px 52px">${start-prev} min libres</div>`:'';prev=Math.max(prev,end);return `${gap}<div class="agenda-line"><div class="agenda-time">${esc(i.time)}</div><div class="agenda-card ${conflict?'conflict':''}" style="--accent:${color};--tint:${tint}"><span class="symbol">${symbol}</span><div class="details"><div class="item-title">${esc(i.name)}</div><div class="muted">${esc(i.time)}–${clock(end)} · ${duration(i)} min</div>${conflict?'<div class="warn">Se superpone con otra actividad</div>':''}</div><button class="smallbtn" onclick="openDayEditor('${esc(i.id)}')">Mover</button></div></div>`}).join('')}
function openDayEditor(id){dayEditing=id;dayError='';drawDayEditor()}
function drawDayEditor(){let el=document.getElementById('day-editor');if(!el)return;if(!dayEditing){el.innerHTML='';return}let i=due(date).find(x=>x.id===dayEditing);if(!i)return;el.innerHTML=`<div class="editbox"><h2>Modificar solo ${esc(date)}</h2><div class="item-title">${esc(i.name)}</div><form onsubmit="saveDayEdit(event,'${esc(i.id)}')"><div class="grid2"><div class="field"><label>Nuevo inicio</label><input type="time" name="time" required value="${esc(i.time)}"></div><div class="field"><label>Duración (minutos)</label><input type="number" name="duration" min="5" max="1440" step="5" required value="${duration(i)}"></div></div><div class="field"><label><input type="checkbox" name="allowOverlap"> Permitir superposición excepcional</label></div><div class="row" style="flex-wrap:wrap"><button class="primary" type="submit">Guardar solo este día</button><button class="secondary" type="button" onclick="resetDayEdit('${esc(i.id)}')">Restablecer rutina</button><button class="secondary" type="button" onclick="dayEditing=null;drawDayEditor()">Cancelar</button></div>${dayError?`<p class="warn">${esc(dayError)}</p>`:''}</form></div>`;el.scrollIntoView({block:'nearest',behavior:'smooth'})}
function saveDayEdit(e,id){e.preventDefault();let f=new FormData(e.target),time=f.get('time'),start=minTime(time),dur=Number(f.get('duration'));if(!Number.isFinite(start)||!Number.isFinite(dur)||dur<5||start+dur>1440){dayError='El bloque debe terminar antes de las 24:00.';drawDayEditor();return}let others=due(date).filter(x=>x.id!==id&&x.time);let conflict=others.some(x=>start<iTime(x)+duration(x)&&iTime(x)<start+dur);if(conflict&&!f.has('allowOverlap')){dayError='Ese horario se superpone con otra actividad. Elegí otro horario o habilitá la superposición excepcional.';drawDayEditor();return}state.overrides[date+'|'+id]={time,duration:dur};save();dayEditing=null;dayError='';render()}
function resetDayEdit(id){delete state.overrides[date+'|'+id];save();dayEditing=null;dayError='';render()}
function section(title,arr){return `<div class="section-title">${title}</div><section class="panel">${arr.length?arr.map(renderItem).join(''):'<div class="empty">No hay actividades para esta fecha.</div>'}</section>`}
function renderItem(i){let v=value(i,date),done=complete(i,date),action=i.kind==='check'?`<input class="check" type="checkbox" ${v?'checked':''} onchange="setLog('${i.id}',this.checked)">`:i.kind==='rating'?`<div class="score">${[['yes','Sí'],['partial','Parcial'],['no','No']].map(([x,t])=>`<button class="${v===x?'selected':''}" onclick="setLog('${i.id}','${x}')">${t}</button>`).join('')}</div>`:`<div class="counter"><button onclick="setLog('${i.id}',Math.max(0,Number(value(state.items.find(x=>x.id==='${i.id}'),date))-${Number(i.step||1)}))">−</button><strong>${Number(v)} / ${Number(i.target)} ${esc(i.unit)}</strong><button onclick="setLog('${i.id}',Number(value(state.items.find(x=>x.id==='${i.id}'),date))+${Number(i.step||1)})">+</button></div><div class="bar"><div style="width:${Math.min(100,Number(v)/Number(i.target)*100)}%"></div></div>`;return `<div class="item"><div class="row"><span class="time">${esc(i.time||'Libre')}</span><div style="flex:1;min-width:0"><div class="item-title" style="${done?'color:#3b9478':''}">${esc(i.name)} ${done?'✓':''}</div><div class="muted">${esc(i.category)}</div>${i.kind==='check'?'':action}</div>${i.kind==='check'?action:''}</div></div>`}
function renderCalendar(){let days=Array.from({length:14},(_,n)=>{let d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);let k=isoLocal(d),arr=due(k);return `<button class="secondary" onclick="date='${k}';go('Hoy')" style="text-align:left"><strong>${weekday[d.getDay()]} ${d.getDate()}/${d.getMonth()+1}</strong><div class="muted">${arr.filter(i=>complete(i,k)).length}/${arr.length} completados</div><div class="bar"><div style="width:${pct(arr,k)}%"></div></div></button>`}).join('');return `${dateSelector()}<section class="panel"><h2>Próximos 14 días</h2><div class="grid2">${days}</div></section>`}
function renderList(repeat){let list=state.items.filter(i=>i.repeat===repeat);return `<section class="panel"><div class="row between"><h2>${repeat?'Hábitos recurrentes':'Tareas puntuales'}</h2><button class="primary" onclick="openEditor(${repeat})">+ Agregar</button></div>${list.map(i=>`<div class="item row between"><div><div class="item-title">${esc(i.name)}</div><div class="muted">${esc(i.category)} · ${i.time?esc(i.time):'Sin horario'} · ${repeat?i.days.map(d=>weekday[d]).join(', '):esc(i.date||'Sin fecha')}</div></div><button class="smallbtn" onclick="openEditor(${repeat},'${i.id}')">Editar</button></div>`).join('')||'<div class="empty">Todavía no hay registros.</div>'}</section><div id="editor"></div>`}
function openEditor(repeat,id){editing=id||null;let i=state.items.find(x=>x.id===id)||{name:'',category:'Personal',kind:'check',time:'',days:[0,1,2,3,4,5,6],date:date,target:8,step:1,unit:'veces'};document.getElementById('editor').innerHTML=`<section class="panel"><h2>${id?'Editar':'Crear'} ${repeat?'hábito':'tarea'}</h2><form onsubmit="saveEditor(event,${repeat})"><div class="field"><label>Nombre</label><input name="name" required value="${esc(i.name)}"></div><div class="grid2"><div class="field"><label>Categoría</label><input name="category" value="${esc(i.category)}"></div><div class="field"><label>Tipo de seguimiento</label><select name="kind" onchange="toggleQuantity(this.value)">${[['check','Checklist'],['quantity','Cantidad'],['rating','Evaluación']].map(([v,t])=>`<option value="${v}" ${i.kind===v?'selected':''}>${t}</option>`).join('')}</select></div></div><div class="grid2"><div class="field"><label>Horario (opcional)</label><input type="time" name="time" value="${esc(i.time)}"></div>${repeat?'<div class="field"><label>Repetición</label><div class="muted" style="padding-top:12px">Elegí los días abajo</div></div>':`<div class="field"><label>Fecha</label><input type="date" name="date" value="${esc(i.date)}" required></div>`}</div>${repeat?`<div class="field"><label>Días de repetición</label><div class="days">${weekday.map((d,n)=>`<label><input type="checkbox" name="days" value="${n}" ${i.days.includes(n)?'checked':''}> ${d}</label>`).join('')}</div></div>`:''}<div id="quantity" class="grid2 ${i.kind==='quantity'?'':'hidden'}"><div class="field"><label>Objetivo</label><input type="number" min="0.01" step="any" name="target" value="${i.target||8}"></div><div class="field"><label>Incremento</label><input type="number" min="0.01" step="any" name="step" value="${i.step||1}"></div><div class="field"><label>Unidad</label><input name="unit" value="${esc(i.unit||'veces')}"></div></div><div class="row between"><button class="primary" type="submit">Guardar</button>${id?`<button type="button" class="secondary danger" onclick="deleteItem('${id}')">Eliminar</button>`:''}<button type="button" class="secondary" onclick="document.getElementById('editor').innerHTML=''">Cancelar</button></div></form></section>`;document.getElementById('editor').scrollIntoView({behavior:'smooth',block:'nearest'})}
function toggleQuantity(v){document.getElementById('quantity').classList.toggle('hidden',v!=='quantity')}
function saveEditor(e,repeat){e.preventDefault();let f=new FormData(e.target),days=f.getAll('days').map(Number);if(repeat&&!days.length){alert('Seleccioná al menos un día');return}let old=state.items.find(x=>x.id===editing);let item={id:editing||'i'+Date.now(),name:f.get('name').trim(),category:f.get('category').trim()||'Personal',kind:f.get('kind'),time:f.get('time')||'',repeat,days:repeat?days:[],date:repeat?null:f.get('date'),target:Number(f.get('target'))||1,step:Number(f.get('step'))||1,unit:f.get('unit')||'veces'};if(old)Object.assign(old,item);else state.items.push(item);save();editing=null;render()}
function deleteItem(id){if(!confirm('¿Eliminar esta actividad?'))return;state.items=state.items.filter(i=>i.id!==id);save();render()}
function renderStats(){let dates=Array.from({length:7},(_,i)=>{let d=new Date(today+'T12:00:00');d.setDate(d.getDate()-6+i);return isoLocal(d)});let total=0,completed=0;dates.forEach(d=>{let a=due(d);total+=a.length;completed+=a.filter(i=>complete(i,d)).length});return `<section class="panel"><h2>Últimos 7 días</h2><div class="metric">${total?Math.round(100*completed/total):0}%</div><div class="muted">${completed} de ${total} actividades completadas</div><div class="progress"><div class="fill" style="width:${total?completed/total*100:0}%"></div></div>${dates.map(d=>`<div class="item row between"><span>${esc(d)}</span><span class="muted">${pct(due(d),d)}%</span><div class="bar" style="width:42%"><div style="width:${pct(due(d),d)}%"></div></div></div>`).join('')}</section><section class="panel"><h2>Datos y respaldo</h2><p class="notice">Los datos se guardan en este navegador y no se sincronizan entre dispositivos. Exportá copias periódicas.</p><div class="row" style="flex-wrap:wrap"><button class="primary" onclick="exportData()">Exportar JSON</button><label class="secondary" style="cursor:pointer">Importar JSON<input type="file" accept="application/json" class="hidden" onchange="importData(event)"></label></div></section>`}
function exportData(){let blob=new Blob([JSON.stringify({version:2,exportedAt:new Date().toISOString(),...state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='habitos-respaldo-'+today+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importData(e){try{let data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data.items)||typeof data.logs!=='object'||!data.logs)throw Error();if(!confirm('¿Reemplazar los datos actuales con esta copia?'))return;state={items:data.items,logs:data.logs,overrides:data.overrides||{}};save();render()}catch{alert('Archivo de respaldo no válido')}}
render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
